# ----------------------------------------------------------------------
# kubesupport: everything it needs, in one file.
#
# Before applying, edit two things (search for "EDIT"):
#   1. The image: your Docker Hub user/org.
#   2. The ConfigMap: CLUSTER_NAME (and ALLOWED_NAMESPACES if you want alerts for some namespaces only).
# Create the Secret "kubesupport-secrets" first (docs/INSTALLATION.md, step 5), then:
#   kubectl apply -f deploy/deployment.yaml
# For activity notices (exec, new services, RBAC changes, ...) also run deploy/webhook-cert.sh.
#
# Permissions: kubesupport can READ every object in the cluster, in every namespace, except
# Secrets. It cannot create, change or delete anything.
# ----------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesupport
  namespace: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
---
# --- PERMISSIONS: cluster-wide, read-only, never Secrets ---
# 1. Kubernetes' built-in "view" role, in every namespace: pods, logs, services, endpoints,
#    ingresses, deployments, statefulsets, jobs, cronjobs, configmaps, PVCs, HPAs, network
#    policies, events, ... (and the custom resources that register with "view").
#    By design "view" never includes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesupport-view
  labels:
    app.kubernetes.io/name: kubesupport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubesupport
    namespace: kubesupport
---
# 2. What "view" leaves out: cluster-level objects and RBAC, plus (explicitly) everything
#    kubesupport's own tools read. Still read-only, still no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesupport-cluster-read
  labels:
    app.kubernetes.io/name: kubesupport
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csidrivers, csinodes, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesupport-cluster-read
  labels:
    app.kubernetes.io/name: kubesupport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesupport-cluster-read
subjects:
  - kind: ServiceAccount
    name: kubesupport
    namespace: kubesupport
---
# --- SETTINGS ---
# After changing these: kubectl apply -f deploy/deployment.yaml && kubectl -n kubesupport rollout restart deploy/kubesupport
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesupport-config
  namespace: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
data:
  CLUSTER_NAME: "Cashier-Dev"                 # EDIT: shown on every Teams message, e.g. "prod-eks"
  TIMEZONE: "Asia/Kolkata"         # EDIT: time zone for times in RCAs and reports (IANA name, e.g. "Europe/London"; default UTC)
  LOG_LEVEL: "INFO"                # DEBUG | INFO | WARNING | ERROR
  ALLOWED_NAMESPACES: "*"          # namespaces for incident alerts and Teams answers; "*" = all (permissions are cluster-wide either way)
  # --- AI model (docs/AI_PROVIDERS.md). The key goes in the Secret as LLM_API_KEY. ---
  LLM_PROVIDER: "cursor"             # EDIT: groq | anthropic | cursor | gemini | openai | azure-openai | openrouter | mistral | ollama | custom | none
  LLM_MODEL: ""                    # "" = the provider's default model (required for openai, azure-openai, ollama, custom)
  LLM_BASE_URL: ""                 # "" = the provider's default endpoint (required for azure-openai, ollama, custom)
  LLM_EFFORT: ""                   # "" = provider default; low | medium | high ("none" = don't send)
  LLM_MAX_STEPS: ""                # "" = provider default: model calls per answer or RCA
  LLM_TOOL_OUTPUT_CHARS: ""        # "" = provider default: characters of one tool result given to the model
  LLM_MAX_REQUEST_CHARS: ""        # "" = provider default: size of one request (raise on a paid Groq plan)
  LLM_MAX_OUTPUT_TOKENS: ""        # "" = provider default: longest reply
  LLM_TIMEOUT_SECONDS: ""          # "" = provider default: one model call (Cursor: one whole run)
  LLM_FALLBACKS: "default"         # Claude only: server-side refusal fallback; "off" to disable
  LLM_DEADLINE_SECONDS: "300"      # longest an AI answer or RCA may take; then the built-in rules answer
  ANSWER_MAX_WORDS: "80"           # words an answer may have outside its table; clearly longer ones are rewritten once ("0" = no limit)
  WATCH_ENABLED: "true"            # "false" = no incident alerts (questions still work)
  WATCH_INTERVAL_SECONDS: "60"     # how often the cluster is checked for failing pods
  ALERT_COOLDOWN_MINUTES: "60"     # reminder for a still-open incident at most this often
  RESOLVE_AFTER_MINUTES: "10"      # incident must be gone this long before "Resolved" is sent
  PENDING_GRACE_MINUTES: "5"       # a pod Pending longer than this is an incident
  MAX_LLM_RCA_PER_HOUR: "10"       # AI-model RCAs per hour for alerts; then rule-based RCAs (Groq free plan: keep it low)
  ACTIVITY_ENABLED: "true"         # activity notices (needs deploy/webhook-cert.sh); "false" to switch off
  ACTIVITY_BATCH_SECONDS: "60"     # activity is grouped into one Teams card per this many seconds
  ACTIVITY_IGNORE_USERS: "system:node:,system:kube-,system:apiserver,system:serviceaccount:kube-system:,eks:,system:serviceaccount:kubesupport:"  # callers whose actions are not reported (prefixes)
  ACTIVITY_IGNORE_NAMESPACES: "kube-node-lease"  # namespaces whose activity is not reported
  ACTIVITY_IGNORE_KINDS: ""        # kinds whose activity is not reported, e.g. "Pod,Job" when a pipeline or operator is too noisy
  TEAMS_TENANT_ID: "5a1f4efd-5119-4558-8d3a-fea50f623c20"              # recommended: only answer Teams messages from your Microsoft 365 tenant (Step 8.5)
  TEAMS_ALLOWED_USER_IDS: "38a349d8-18b4-430c-9a4f-f358a5307c5d"       # recommended: comma-separated Entra object IDs of the people allowed to ask (Step 8.5)
  BOUNDARIES_ENABLED: "true"       # questions about kubesupport itself (setup, AI model, rules, its namespace) are refused and reported to the administrators (docs/RULES.md, section 6)
  PROTECTED_NAMESPACES: "kubesupport"  # namespaces people in Teams can't read; change it if kubesupport runs in another namespace ("none" = protect no namespace)
  REPORT_DIR: "/tmp/reports"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesupport
  namespace: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
spec:
  replicas: 1                      # always 1: the incident watcher and activity feed run inside the pod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kubesupport
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubesupport
      annotations:
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      serviceAccountName: kubesupport
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # EDIT: your Docker Hub user/org. In production pin a tag CI pushed (sha-xxxxxxx) so a restart
          # never picks up an untested image; ":latest" + Always is convenient for testing only.
          image: docker.io/jayachandra261020/kubesupport:latest
          imagePullPolicy: Always
          ports:
            - name: http             # internal API and health checks (never exposed)
              containerPort: 8000
            - name: teams            # POST /teams/webhook only; reached only through the Cloudflare Tunnel
              containerPort: 8080
            - name: webhook          # activity webhook (HTTPS), called by the Kubernetes API server
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: kubesupport-config
            - secretRef:
                name: kubesupport-secrets   # LLM_API_KEY, AGENT_API_KEY, TEAMS_* (docs/INSTALLATION.md, Step 5)
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:              # the API is up
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:               # fails when the watcher stops scanning or the Teams server dies: restart
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi              # headroom for large clusters and the Cursor provider's helper process
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: webhook-tls
              mountPath: /etc/kubesupport/webhook-tls
              readOnly: true
      volumes:
        - name: tmp                  # the only writable place: reports, the Cursor SDK's state (HOME=/tmp)
          emptyDir:
            sizeLimit: 512Mi
        - name: webhook-tls          # created by deploy/webhook-cert.sh; until then the webhook is simply off
          secret:
            secretName: kubesupport-webhook-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: kubesupport
  namespace: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubesupport
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Target of the Cloudflare Tunnel route (deploy/cloudflare-tunnel.yaml): POST /teams/webhook only.
apiVersion: v1
kind: Service
metadata:
  name: kubesupport-teams
  namespace: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubesupport
  ports:
    - name: teams
      port: 80
      targetPort: teams
---
# --- NETWORK POLICY: who may connect to the kubesupport pod ---
# Enforced when the cluster runs a network-policy engine (on EKS: the VPC CNI with network
# policy turned on; docs/INSTALLATION.md, Step 3.4). Without one it is simply ignored.
#   8080 (Teams webhook)      only from the Cloudflare Tunnel pods
#   8443 (activity webhook)   from the Kubernetes API server (EKS control plane)
#   8000 (internal API)       from no pod at all; kubectl port-forward and health checks still work
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubesupport
  namespace: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubesupport
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubesupport-tunnel
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 8443
