# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: only needed to ask the agent questions from a Teams channel.
# Alerts work without it.
#
# Exposes exactly ONE path, /teams/webhook. Every request to it must carry a valid
# HMAC signature from your Teams outgoing webhook, and everything else in the agent
# stays internal.
#
# EDIT for your ingress controller: host (twice), ingressClassName, and TLS.
# Then: kubectl apply -f deploy/ingress.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubesupport
  namespace: kubesupport
  labels:
    app.kubernetes.io/name: kubesupport
  annotations:
    # ── NGINX ingress + cert-manager (default below) ──
    cert-manager.io/cluster-issuer: letsencrypt-prod      # EDIT: your ClusterIssuer (kubectl get clusterissuer)
    # ── AWS Load Balancer Controller (ALB) + ACM instead: ──
    #   1. delete the cert-manager line above and the whole "tls:" section below,
    #   2. set ingressClassName: alb, and
    #   3. uncomment these:
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id>
    # alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: nginx                                 # EDIT: kubectl get ingressclass
  tls:
    - hosts: [kubesupport.example.com]                      # EDIT: your hostname
      secretName: kubesupport-tls
  rules:
    - host: kubesupport.example.com                         # EDIT: your hostname
      http:
        paths:
          - path: /teams/webhook
            pathType: Exact
            backend:
              service:
                name: kubesupport
                port:
                  name: http
