name: CI

# Lint + tests (including checks of deploy/*.yaml) on every PR and push.
# On push to main: build the agent image for amd64 + arm64 and push it to Docker Hub as
#   docker.io/<DOCKERHUB_USERNAME>/kubesupport:sha-<7 chars>  and  :latest
# "Run workflow" on main (Actions tab) rebuilds and pushes the image without a code change:
# use it to pick up operating-system security updates.
# Needs (GitHub → Settings → Secrets and variables → Actions):
#   variable DOCKERHUB_USERNAME  - your Docker Hub user or organization
#   secret   DOCKERHUB_TOKEN     - a Docker Hub access token with Read & Write

on:
  pull_request:
    branches: [main]
    paths: ["agent/**", "deploy/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["agent/**", "deploy/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: kubesupport

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: flake8
        run: flake8 . --count --select=E9,F63,F7,F82,F401,F841 --show-source --statistics
      - name: pytest (agent + deploy/*.yaml checks)
        run: pytest tests -q

  build-and-push:
    name: Build & push image to Docker Hub
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image name and tag
        id: meta
        run: |
          echo "image=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Summary
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"; TAG="${{ steps.meta.outputs.tag }}"
          {
            echo "### Image pushed"
            echo ""
            echo "\`${IMAGE}:${TAG}\` (also \`${IMAGE}:latest\`), for linux/amd64 and linux/arm64"
            echo ""
            echo "Roll it out to a cluster where deploy/deployment.yaml is applied:"
            echo '```bash'
            echo "kubectl -n kubesupport set image deployment/kubesupport agent=${IMAGE}:${TAG}"
            echo '```'
            echo "or, if deployment.yaml uses \`:latest\`: \`kubectl -n kubesupport rollout restart deploy/kubesupport\`"
          } >> "$GITHUB_STEP_SUMMARY"
