apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rca-platform-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jaychandra1/Agent-kube.git
    targetRevision: HEAD
    path: gitops/argocd
    directory:
      include: "application-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

